<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live 歌詞送り</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body.hidecursor { cursor: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #05050f; }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .ln {
    position: absolute; left: 960px; top: 0; white-space: nowrap; font-weight: 700; color: #fff;
    font-family: 'BIZ UDPGothic', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', sans-serif;
    letter-spacing: 0.04em; paint-order: stroke fill; -webkit-text-stroke: 8px rgba(16, 8, 32, 0.95);
    transition: transform 320ms cubic-bezier(.2, .7, .3, 1), opacity 320ms ease, filter 320ms ease, text-shadow 320ms ease;
    will-change: transform, opacity;
  }
  .ln::after {
    content: ''; position: absolute; left: 22%; right: 22%; bottom: -0.16em; height: 4px; border-radius: 2px;
    background: var(--acc); box-shadow: 0 0 10px var(--acc); transform: scaleX(0); transition: transform 500ms cubic-bezier(.2, .7, .3, 1) 120ms, opacity 200ms;
  }
  .ln.next { opacity: .68; filter: blur(0); text-shadow: 0 0 0 transparent; -webkit-text-stroke-width: 6px; }
  .ln.cur { opacity: 1; text-shadow: 0 0 18px var(--acc), 0 0 42px var(--acc); }
  .ln.cur::after { transform: scaleX(1); }
  .ln.enter { opacity: 0; filter: blur(4px); }
  .ln.gone { opacity: 0; filter: blur(6px); }
  .ln.gone::after { opacity: 0; }
  #title { position: absolute; left: 0; right: 0; top: 0; text-align: center; color: #fff; transition: opacity 900ms ease; pointer-events: none; }
  #title .t { position: absolute; left: 0; right: 0; top: 200px; font: 600 230px/1 'Bahnschrift', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .1em;
    text-shadow: 0 0 22px #ff7319, 0 0 60px #ff7319; paint-order: stroke fill; -webkit-text-stroke: 6px rgba(32, 8, 16, .9); }
  #title .b { position: absolute; left: 0; right: 0; top: 450px; font: 400 56px/1 'Bahnschrift', 'Segoe UI', Arial, sans-serif; letter-spacing: .25em; opacity: .9; }
  #title.off { opacity: 0; }
  #help { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, .82); color: #fff; padding: 32px 44px; border-radius: 16px;
    font: 30px/1.7 'BIZ UDPGothic', 'Hiragino Sans', 'Yu Gothic', sans-serif; display: none; z-index: 9; }
  #help.on { display: block; }
  #help kbd { background: #333; border-radius: 6px; padding: 0 10px; font-family: inherit; }
  #toast { position: absolute; right: 30px; bottom: 24px; color: rgba(255, 255, 255, .7); font: 24px 'BIZ UDPGothic', 'Yu Gothic', sans-serif; transition: opacity 1s; }
  #toast.off { opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="title"><div class="t"></div><div class="b"></div></div>
  <div id="lines"></div>
  <div id="help">
    <div><kbd>Space</kbd> <kbd>→</kbd> <kbd>Enter</kbd> クリック … 次の歌詞へ</div>
    <div><kbd>←</kbd> <kbd>BackSpace</kbd> … 1つ戻る</div>
    <div><kbd>B</kbd> <kbd>.</kbd> … 歌詞を一時的に消す／戻す</div>
    <div><kbd>Home</kbd> … 最初（タイトル）に戻る</div>
    <div><kbd>F</kbd> … 全画面表示の切替</div>
    <div><kbd>H</kbd> … この説明を閉じる</div>
  </div>
  <div id="toast">F：全画面 ／ H：操作説明 ／ Space：次の歌詞</div>
</div>
<script>
const DATA = {"title":"Live","band":"orangedevil's family","lines":[{"i":0,"section":"Verse 1","type":"verse","text":"僕と君の道が　ふと交わって","breakAfter":false},{"i":1,"section":"Verse 1","type":"verse","text":"こうして今一緒に笑ってる","breakAfter":false},{"i":2,"section":"Verse 1","type":"verse","text":"あの時もし君と出会わなければ","breakAfter":false},{"i":3,"section":"Verse 1","type":"verse","text":"いまごろ僕はどうしていたのかな","breakAfter":false},{"i":4,"section":"Verse 2","type":"verse","text":"ずっとこの時が　続けばいいのに","breakAfter":false},{"i":5,"section":"Verse 2","type":"verse","text":"僕はいま　強く思ってる","breakAfter":false},{"i":6,"section":"Verse 2","type":"verse","text":"どんなに手をぎゅっと　握りしめても","breakAfter":false},{"i":7,"section":"Verse 2","type":"verse","text":"手のひらから　時がすり抜けてく","breakAfter":false},{"i":8,"section":"Pre-Chorus","type":"pre","text":"よどみなく流れる　川のように","breakAfter":false},{"i":9,"section":"Pre-Chorus","type":"pre","text":"同じ場所に誰もとどまることはできない","breakAfter":false},{"i":10,"section":"Pre-Chorus","type":"pre","text":"失うのがこんなに怖いのは","breakAfter":false},{"i":11,"section":"Pre-Chorus","type":"pre","text":"それ以上に大切だから","breakAfter":false},{"i":12,"section":"Chorus","type":"chorus","text":"僕らの今を精いっぱい生きよう","breakAfter":false},{"i":13,"section":"Chorus","type":"chorus","text":"昨日にとらわれずに","breakAfter":false},{"i":14,"section":"Chorus","type":"chorus","text":"失くしたものばかり数えるより","breakAfter":false},{"i":15,"section":"Chorus","type":"chorus","text":"目の前の笑顔　見つめよう","breakAfter":false},{"i":16,"section":"Chorus","type":"chorus","text":"この瞬間を　胸に刻もう　強く","breakAfter":false},{"i":17,"section":"Verse 1","type":"verse","text":"たくさんの出会い　いくつもの別れ","breakAfter":false},{"i":18,"section":"Verse 1","type":"verse","text":"さよならさえ　ちゃんと言えないまま","breakAfter":false},{"i":19,"section":"Verse 1","type":"verse","text":"あの時もっとなにか　できたかな","breakAfter":false},{"i":20,"section":"Verse 1","type":"verse","text":"後悔だけが胸に押し寄せてる","breakAfter":true},{"i":21,"section":"Bridge","type":"bridge","text":"明日がどうなるかなんて","breakAfter":false},{"i":22,"section":"Bridge","type":"bridge","text":"誰もわからない","breakAfter":false},{"i":23,"section":"Bridge","type":"bridge","text":"僕らの時間は限られてる","breakAfter":false},{"i":24,"section":"Bridge","type":"bridge","text":"だからこそ愛おしい","breakAfter":false},{"i":25,"section":"Chorus1","type":"chorus","text":"僕らの今を精いっぱい生きよう","breakAfter":false},{"i":26,"section":"Chorus1","type":"chorus","text":"すべてを受け入れて","breakAfter":false},{"i":27,"section":"Chorus1","type":"chorus","text":"流した涙も　あの日の痛みも","breakAfter":false},{"i":28,"section":"Chorus1","type":"chorus","text":"いつか笑えるよに","breakAfter":false},{"i":29,"section":"Last Chorus","type":"last","text":"僕らの今を精いっぱい生きよう","breakAfter":false},{"i":30,"section":"Last Chorus","type":"last","text":"あしたをおそれずに","breakAfter":false},{"i":31,"section":"Last Chorus","type":"last","text":"だしおしみせずに　いつだって全力で","breakAfter":false},{"i":32,"section":"Last Chorus","type":"last","text":"笑って泣いて歌おう　かけがえのない今を","breakAfter":false}]};
const PAL = {
  intro:  { base: [0.020, 0.020, 0.060], a: [1.00, 0.45, 0.10], b: [0.40, 0.25, 0.95], k: 0.55, dens: 0.45 },
  verse:  { base: [0.015, 0.035, 0.100], a: [0.15, 0.60, 1.00], b: [0.50, 0.30, 1.00], k: 0.65, dens: 0.55 },
  pre:    { base: [0.050, 0.020, 0.100], a: [0.60, 0.30, 1.00], b: [1.00, 0.30, 0.60], k: 0.80, dens: 0.70 },
  chorus: { base: [0.100, 0.020, 0.040], a: [1.00, 0.45, 0.08], b: [1.00, 0.15, 0.45], k: 1.00, dens: 1.00 },
  bridge: { base: [0.020, 0.020, 0.090], a: [0.45, 0.35, 1.00], b: [0.20, 0.80, 1.00], k: 0.60, dens: 0.50 },
  last:   { base: [0.110, 0.040, 0.020], a: [1.00, 0.70, 0.20], b: [1.00, 0.35, 0.10], k: 1.15, dens: 1.20 },
  outro:  { base: [0.030, 0.020, 0.050], a: [1.00, 0.50, 0.15], b: [0.50, 0.25, 0.90], k: 0.50, dens: 0.45 },
};
const rgb = (c, a = 1) => `rgba(${c.map(v => Math.round(Math.min(1, v) * 255)).join(',')},${a})`;

// ---- 進行ステップ：タイトル → 各行（間奏の位置には「歌詞なし＋次行の先出し」ステップを挟む） ----
const L = DATA.lines;
const steps = [{ kind: 'title', pal: 'intro', next: null }];
L.forEach((l, i) => {
  steps.push({ kind: 'line', i, pal: l.type, next: i + 1 < L.length && !l.breakAfter ? i + 1 : null });
  if (l.breakAfter && i + 1 < L.length) steps.push({ kind: 'break', pal: l.type, next: i + 1 });
});
steps.push({ kind: 'end', pal: 'outro', next: null });

// ---- 画面スケーリング ----
const stage = document.getElementById('stage');
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transformOrigin = '50% 50%'; stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit); fit();

// ---- 歌詞表示 ----
const Y_MAIN = 324, Y_NEXT = 478;
const vlen = s => [...s].reduce((n, ch) => n + (ch === '　' ? 0.6 : /[\x20-\x7e]/.test(ch) ? 0.55 : 1), 0);
const mainFs = s => Math.max(72, Math.min(116, Math.floor(1720 / vlen(s))));
const nextFs = s => Math.max(40, Math.min(58, Math.floor(1500 / vlen(s))));
const linesEl = document.getElementById('lines');
const titleEl = document.getElementById('title');
titleEl.querySelector('.t').textContent = DATA.title;
titleEl.querySelector('.b').textContent = DATA.band;
let curEl = null, nextEl = null, idx = 0, hidden = false;

function place(el, state) {
  const txt = el.dataset.text, fs = mainFs(txt);
  el.style.fontSize = fs + 'px';
  const y = state === 'cur' ? Y_MAIN : state === 'gone' ? Y_MAIN - 34 : Y_NEXT;
  const sc = state === 'cur' ? 1 : state === 'gone' ? 1.04 : nextFs(txt) / fs;
  el.style.transform = `translate(-50%, ${y}px) translate(0, -50%) scale(${sc})`;
}
function makeLine(i, state) {
  const el = document.createElement('div');
  el.className = 'ln ' + state + ' enter';
  el.dataset.text = L[i].text; el.dataset.i = i;
  el.textContent = L[i].text;
  el.style.setProperty('--acc', rgb(PAL[L[i].type].a));
  place(el, state);
  linesEl.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('enter')));
  return el;
}
function retire(el) { if (!el) return; el.className = 'ln gone'; place(el, 'gone'); setTimeout(() => el.remove(), 400); }

function show(n, dir) {
  idx = Math.max(0, Math.min(steps.length - 1, n));
  const st = steps[idx];
  titleEl.classList.toggle('off', st.kind !== 'title' || hidden);
  targetPal = PAL[st.pal];
  const wantCur = st.kind === 'line' ? st.i : null;
  const wantNext = st.next;
  // 進む方向で、先出し中の行がそのまま現在行になる場合はせり上げアニメーション
  if (dir > 0 && wantCur != null && nextEl && +nextEl.dataset.i === wantCur) {
    retire(curEl); curEl = nextEl; curEl.className = 'ln cur'; place(curEl, 'cur'); nextEl = null;
  } else if (!curEl || wantCur == null || +curEl.dataset.i !== wantCur) {
    retire(curEl); curEl = null;
    if (wantCur != null) curEl = makeLine(wantCur, 'cur');
  }
  if (!nextEl || wantNext == null || +nextEl.dataset.i !== wantNext) {
    retire(nextEl); nextEl = null;
    if (wantNext != null) setTimeout(() => { if (steps[idx] === st && !nextEl) { nextEl = makeLine(wantNext, 'next'); applyHidden(); } }, st.kind === 'title' ? 0 : 350);
  }
  applyHidden();
}
function applyHidden() { linesEl.style.transition = 'opacity 300ms'; linesEl.style.opacity = hidden ? 0 : 1; titleEl.classList.toggle('off', steps[idx].kind !== 'title' || hidden); }

addEventListener('keydown', e => {
  const k = e.key;
  if ([' ', 'ArrowRight', 'Enter', 'PageDown', 'ArrowDown'].includes(k)) { e.preventDefault(); show(idx + 1, 1); }
  else if (['ArrowLeft', 'Backspace', 'PageUp', 'ArrowUp'].includes(k)) { e.preventDefault(); show(idx - 1, -1); }
  else if (k === 'b' || k === 'B' || k === '.') { hidden = !hidden; applyHidden(); }
  else if (k === 'Home') show(0, -1);
  else if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'h' || k === 'H') document.getElementById('help').classList.toggle('on');
});
addEventListener('click', () => show(idx + 1, 1));
let mt; addEventListener('mousemove', () => { document.body.classList.remove('hidecursor'); clearTimeout(mt); mt = setTimeout(() => document.body.classList.add('hidecursor'), 2000); });
setTimeout(() => document.getElementById('toast').classList.add('off'), 6000);

// ---- 背景エフェクト（MP4版と同じ設計：ゆっくり動くビーム・光線・光の粒。急な明滅なし） ----
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = 480; off.height = 270; const oc = off.getContext('2d');
let pal = JSON.parse(JSON.stringify(PAL.intro)), targetPal = PAL.intro;
const lerp = (a, b, m) => Array.isArray(a) ? a.map((v, i) => v + (b[i] - v) * m) : a + (b - a) * m;
const smooth = x => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
let seed = 12345; const rnd = () => ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296);
const PARTS = Array.from({ length: 110 }, () => ({ x: rnd(), sp: 0.012 + rnd() * 0.035, ph: rnd(), r: 1.2 + Math.pow(rnd(), 2.2) * 9, c: rnd(), sway: 4 + rnd() * 14, sf: 0.1 + rnd() * 0.25, so: rnd() * 6.28 }));
const BEAMS = [0, 1, 2, 3, 4, 5].map(j => ({ ox: 0.08 + 0.168 * j, base: (j % 2 ? 1 : -1) * (0.18 + 0.05 * (j % 3)), per: 7 + j * 1.3, ph: j * 1.7, col: j % 2, order: [4, 2, 0, 1, 3, 5][j] }));
let last = performance.now(), t0 = last;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; const t = (now - t0) / 1000;
  const m = 1 - Math.exp(-dt / 0.9); // 約2.5秒でセクションの配色へ移行
  for (const k of Object.keys(pal)) pal[k] = lerp(pal[k], targetPal[k], m);
  const P = pal, W = 480, H = 270, S = W / 640;
  // ベース
  const g = oc.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(P.base.map(v => v * 0.55 * 1.6))); g.addColorStop(1, rgb(P.base.map(v => v * 1.45 * 1.6)));
  oc.globalCompositeOperation = 'source-over'; oc.fillStyle = g; oc.fillRect(0, 0, W, H);
  const fg = oc.createRadialGradient(W * (0.5 + 0.15 * Math.sin(t * 0.13)), H * 1.05, 0, W * 0.5, H * 1.05, H * 0.9);
  fg.addColorStop(0, rgb(P.a, 0.28 * P.k)); fg.addColorStop(1, rgb(P.a, 0));
  oc.globalCompositeOperation = 'lighter'; oc.fillStyle = fg; oc.fillRect(0, 0, W, H);
  // ビーム
  for (const bm of BEAMS) {
    const wgt = smooth(P.dens * 7.2 - bm.order * 1.1) * P.k;
    if (wgt < 0.003) continue;
    const th = bm.base + 0.32 * Math.sin((2 * Math.PI * t) / bm.per + bm.ph);
    const col = bm.col ? P.b : P.a;
    oc.save(); oc.translate(bm.ox * W, -0.3 * H); oc.rotate(-th);
    const len = H * 1.6;
    for (const [wd, al] of [[0.16, 0.22], [0.05, 0.55]]) {
      const lg = oc.createLinearGradient(0, 0, 0, len);
      lg.addColorStop(0, rgb(col, al * wgt)); lg.addColorStop(0.55, rgb(col, al * wgt * 0.45)); lg.addColorStop(1, rgb(col, 0));
      oc.fillStyle = lg; oc.beginPath(); oc.moveTo(-2 * S, 0); oc.lineTo(2 * S, 0); oc.lineTo(len * wd, len); oc.lineTo(-len * wd, len); oc.closePath(); oc.fill();
    }
    oc.restore();
  }
  // 放射状の光線（サビ系のみ）
  const rayW = smooth((P.dens - 0.6) / 0.4) * 0.16 * P.k;
  if (rayW > 0.002) {
    oc.save(); oc.translate(W * 0.5, H * 0.3); oc.rotate(t * 0.06);
    const rg = oc.createRadialGradient(0, 0, H * 0.12, 0, 0, H * 1.1);
    rg.addColorStop(0, rgb(P.a, 0)); rg.addColorStop(0.35, rgb(P.a, rayW * 0.6)); rg.addColorStop(1, rgb(P.a, 0));
    oc.fillStyle = rg;
    for (let i = 0; i < 14; i++) { const a = (i / 14) * Math.PI * 2; oc.beginPath(); oc.moveTo(0, 0); oc.arc(0, 0, H * 1.2, a - 0.07, a + 0.07); oc.closePath(); oc.fill(); }
    oc.restore();
  }
  // 光の粒
  const nAct = P.dens * PARTS.length * 0.8;
  PARTS.forEach((p, i) => {
    const act = Math.min(1, Math.max(0, nAct - i)); if (act <= 0) return;
    const span = H * 1.3, yy = H * 1.15 - (((t * p.sp * H + p.ph * span) % span) + span) % span;
    const xx = p.x * W + p.sway * S * Math.sin(t * p.sf + p.so);
    const life = smooth((H * 1.1 - yy) / (0.25 * H)) * smooth(yy / (0.35 * H) + 0.15);
    const a = act * life * (p.r > 5 ? 0.22 : 0.55); if (a < 0.003) return;
    const col = lerp(lerp(P.a, P.b, p.c), [1, 1, 1], 0.35), r = p.r * S * 2.2;
    const pg = oc.createRadialGradient(xx, yy, 0, xx, yy, r);
    pg.addColorStop(0, rgb(col, a)); pg.addColorStop(0.4, rgb(col, a * 0.85)); pg.addColorStop(0.5, rgb(col, a * 0.25)); pg.addColorStop(1, rgb(col, 0));
    oc.fillStyle = pg; oc.fillRect(xx - r, yy - r, r * 2, r * 2);
  });
  // 合成：拡大＋ぼかし、歌詞帯の減光、ビネット
  ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'blur(3px)'; ctx.drawImage(off, 0, 0, 1920, 1080); ctx.filter = 'none';
  const dk = ctx.createLinearGradient(0, 324 - 300, 0, 324 + 300);
  dk.addColorStop(0, 'rgba(0,0,0,0)'); dk.addColorStop(0.5, 'rgba(0,0,0,0.38)'); dk.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = dk; ctx.fillRect(0, 0, 1920, 1080);
  const vg = ctx.createRadialGradient(960, 540, 400, 960, 540, 1150);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, 1920, 1080);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
show(0, 1);
</script>
</body>
</html>
